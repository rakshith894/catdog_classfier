services:
  - type: web
    name: pawsai
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn catdog.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
